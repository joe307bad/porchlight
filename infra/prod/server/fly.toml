# Porchlight API (and the browser builder). Deployed by .github/workflows/deploy.yml.
# The connection string comes from the ConnectionStrings__Porchlight secret, created by that workflow.

app = 'porchlight-server'
primary_region = 'iad'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '20s'
    method = 'GET'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
