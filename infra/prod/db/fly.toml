# Postgres for Porchlight: the official image on a Fly volume, the same way fastbreak-o11y runs QuestDB.
# It has no public services. The server reaches it over Fly's private network at porchlight-db.internal:5432.
# POSTGRES_PASSWORD is a secret created by .github/workflows/deploy.yml.
#
# A single machine owns the volume, so always deploy with --ha=false.

app = 'porchlight-db'
primary_region = 'iad'

[build]
  image = 'postgres:17-alpine'

[env]
  POSTGRES_USER = 'porchlight'
  POSTGRES_DB = 'porchlight'
  # A subdirectory, because the volume root contains lost+found.
  PGDATA = '/data/pgdata'

[[mounts]]
  source = 'pgdata'
  destination = '/data'
  initial_size = '1gb'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
