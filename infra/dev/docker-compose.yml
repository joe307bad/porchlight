# Local Keycloak for sign-in during development. ./dev.sh starts it and runs
# infra/keycloak/init-keycloak.sh dev, which seeds the realm and a user:
#
#   username: dev   password: dev
#
# Admin console: http://localhost:8080/admin (admin / admin).
#
# Plus the game's database (multiplayer: accounts' characters, where each was,
# sessions), which the server migrates itself on start (Drizzle, server/drizzle).

name: porchlight-dev

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # The dev database (H2), so the realm and user survive a restart.
      - keycloak-data:/opt/keycloak/data

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: game
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: city
    ports:
      # 5434: this machine already has Postgres on 5432 and 5433.
      - "127.0.0.1:5434:5432"
    volumes:
      - game-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U game -d city"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  keycloak-data:
  game-db:
