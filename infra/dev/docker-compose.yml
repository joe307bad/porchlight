name: porchlight-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: porchlight
      POSTGRES_PASSWORD: porchlight
      POSTGRES_DB: porchlight
    ports:
      # 5433 on the host avoids clashing with a locally installed Postgres.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U porchlight -d porchlight"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
