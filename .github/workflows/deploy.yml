name: Deploy

# Test, build, provision (Terraform) and deploy to the EC2 box. The same shape
# as topspin's deploy-ec2.yml: Terraform owns the box, the box runs Docker
# Compose, and the deploy job copies files over and runs infra/docker/deploy.sh.
# The game is the Unity WebGL build, made by the build job in Unity's Docker
# image (game-ci). See infra/README.md for the one-time setup (secrets,
# including the Unity licence; Google; DNS).

on:
  push:
    branches: [main]
    paths:
      - 'unity/**'
      - 'server/**'
      - 'manage/**'
      # The missions alone go out quickly with missions.yml (a push with other
      # changes too comes here, and copies them along with the server).
      - '!server/missions/**'
      - 'infra/**'
      - 'sim/**'
      - '.github/workflows/deploy.yml'
      # Docs alone (READMEs and other Markdown) don't deploy.
      - '!**/*.md'
  # A pull request is built and tested the same way (the game compiled, the
  # server and the simulation tested), but never deployed: the deploy job is
  # skipped. Test a branch on the dev setup (dev.sh, desktop/dev-mac.sh).
  pull_request:
    paths:
      - 'unity/**'
      - 'desktop/*.sh'
      - 'server/**'
      - 'manage/**'
      - 'sim/**'
      - 'infra/**'
      - '.github/workflows/deploy.yml'
      - '!**/*.md'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  DOMAIN: porchlight.joebad.com
  # The zone the two A records go in (best-effort; see "Point DNS at the box").
  DNS_ZONE: joebad.com

concurrency:
  # Deploys queue one after another; a pull request's runs are their own (a newer push cancels the older).
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --- The game: check its engine-free code, then build it for the web ---------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Unity licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::The UNITY_LICENSE secret isn't set, so the game can't be built. See infra/README.md > One-time setup."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Manage Porchlight (manage/, a React app at /manage), built into the
      # game's StreamingAssets so every build of the game carries it.
      - name: Manage — install, typecheck, test, build
        working-directory: manage
        run: |
          npm ci
          npm test
          npm run build
      # Its map drawn under four times the load towns can carry, in headless
      # Chromium: fails if a frame, or taking in the feed, goes over budget.
      - name: Manage — the map under stress
        working-directory: manage
        run: |
          npx playwright-core install --with-deps --only-shell chromium
          npm run test:browser

      # The towns' traffic and townsfolk, run on the server by the game's own code (sim/):
      # a tick of 40 towns timed (fails over 1 ms a town on average, or if the deltas save
      # too little), the real worker run by the real server end to end, and then the
      # worker published for the box (arm64 Alpine, self-contained) for the deploy job.
      - name: Simulation — build, tick budget
        run: |
          dotnet build sim/Porchlight.Sim.csproj -c Release
          dotnet sim/bin/Release/net8.0/porchlight-sim.dll --bench server/towns 10 1.0
          # A player's game following each town by its deltas shows it as the server has it.
          dotnet sim/bin/Release/net8.0/porchlight-sim.dll --follow server/towns
      - name: Simulation — the server running it, end to end
        working-directory: server
        run: |
          npm ci
          node --test test/sim.test.ts test/sim-room.test.ts
      - name: Simulation — publish for the box
        run: |
          dotnet publish sim/Porchlight.Sim.csproj -c Release -r linux-musl-arm64 --self-contained \
            -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -p:DebugType=none -o "$RUNNER_TEMP/sim-publish"
      - uses: actions/upload-artifact@v4
        with:
          name: sim
          path: ${{ runner.temp }}/sim-publish/porchlight-sim
          if-no-files-found: error
          retention-days: 7

      - name: Game — towns grow (every invariant checked) and repeat
        run: dotnet run --project "unity/Tools~/Checks" -c Release -- towns 60
      # Road hierarchy (FHWA's shares), the ring road, eras, transect zones, neighbourhood units and a second centre.
      - name: Game — towns planned like real ones
        run: dotnet run --project "unity/Tools~/Checks" -c Release -- plan
      # The town's life (docs/town-life.md): a whole day of each starter town and two generated ones, end to
      # end (nobody stuck, trips made, the same day twice), then its rules one scenario at a time.
      - name: Game — a day of each town's life, start to finish, and the same twice
        run: dotnet run --project "unity/Tools~/Checks" -c Release -- traffic-day server/towns 2
      - name: Game — the town's life, rule by rule (players in the road, signals, parking, buses, the wire)
        run: dotnet run --project "unity/Tools~/Checks" -c Release -- life server/towns
      # The county clock (US Eastern, daylight saving and all, on a 12-hour clock) and the junctions' signals
      # and stop signs: one on the drivers' kerb at every lane in, the lights amber then red in step with the cars.
      - name: Game — Eastern time on a 12-hour clock; a signal or stop sign at every lane in, lit as the cars go
        run: |
          dotnet run --project "unity/Tools~/Checks" -c Release -- clock
          dotnet run --project "unity/Tools~/Checks" -c Release -- furniture server/towns
      # The web build grows and builds the towns ahead a share at a time: no share long enough to stall
      # the car (a shared runner is slower than a desk: twice the limit), and the same towns as all at once.
      - name: Game — the county built a share at a time, as the web build does
        run: dotnet run --project "unity/Tools~/Checks" -c Release -- hitches 150
      - name: Game — riding over a town line, one way shown at a time, where you are
        run: |
          dotnet run --project "unity/Tools~/Checks" -c Release -- ride
          dotnet run --project "unity/Tools~/Checks" -c Release -- ways
          dotnet run --project "unity/Tools~/Checks" -c Release -- where
      # The desktop app's server: the released app always plays on the live one, whatever a dev build left
      # behind (the cause of a released app on a Mac hitting a dev server); desktop/dev-mac.sh's can be pointed anywhere.
      - name: Desktop — the released app plays live whatever's left behind; dev and prod Mac scripts
        run: |
          dotnet run --project "unity/Tools~/Checks" -c Release -- servers
          bash -n desktop/dev-mac.sh
          bash -n desktop/prod-mac.sh
      # The presents mission's flying: through the rings, the story's landings, down the chimneys and back.
      - name: Game — the sleigh flies through its rings, lands where it's sent, and down the chimney and back
        run: dotnet run --project "unity/Tools~/Checks" -c Release -- sleigh

      # No cache of Unity's Library: the editor is killed (exit 137) as it opens
      # a restored one, even one saved from exactly these sources, while a cold
      # Library builds fine.

      - name: Game — WebGL build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: unity
          targetPlatform: WebGL
          buildMethod: Porchlight.EditorTools.Setup.BuildWebGL
          # Shown on the sign-in card and in the sidebar (App/BuildInfo.cs).
          customParameters: -porchlightRelease web.${{ github.run_number }} -porchlightCommit ${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: webgl
          path: unity/Builds/WebGL
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/download-artifact@v4
        with:
          name: webgl
          path: site

      # --- Gate: nothing reaches the box unless the server passes too ----------
      - name: Auth service — install, typecheck, test
        working-directory: server
        run: |
          npm ci
          npm run typecheck
          npm test

      # The simulation worker the build job published, beside the server (server/sim/README.md),
      # after the tests (it's the box's, arm64: these tests ran it as built for the runner).
      - uses: actions/download-artifact@v4
        with:
          name: sim
          path: server/sim
      - run: chmod +x server/sim/porchlight-sim

      # --- Provision -----------------------------------------------------------
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_PRIVATE_KEY }}" > ~/.ssh/id_porchlight
          chmod 600 ~/.ssh/id_porchlight
          echo "SSH_PUBLIC_KEY=$(ssh-keygen -y -f ~/.ssh/id_porchlight)" >> "$GITHUB_ENV"

      - name: Terraform state bucket
        run: |
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          BUCKET="porchlight-terraform-state-$ACCOUNT"
          echo "TF_STATE_BUCKET=$BUCKET" >> "$GITHUB_ENV"
          if aws s3api head-bucket --bucket "$BUCKET" 2>/dev/null; then
            exit 0
          fi
          echo "creating $BUCKET"
          aws s3api create-bucket --bucket "$BUCKET" --region "$AWS_REGION"
          aws s3api put-bucket-versioning --bucket "$BUCKET" --versioning-configuration Status=Enabled
          aws s3api put-public-access-block --bucket "$BUCKET" --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: infra/terraform
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=porchlight/terraform.tfstate" \
            -backend-config="region=$AWS_REGION"
          terraform apply -auto-approve -input=false \
            -var="ssh_public_key=$SSH_PUBLIC_KEY" \
            -var="domain=$DOMAIN"
          echo "HOST=$(terraform output -raw elastic_ip)" >> "$GITHUB_ENV"
          echo "SECRET_ID=$(terraform output -raw secret_id)" >> "$GITHUB_ENV"

      - name: Point DNS at the box
        # Best-effort and never fatal, as in topspin: the zone may not be in this
        # account. Caddy keeps retrying certificates until the records exist.
        continue-on-error: true
        run: |
          ZONE=$(aws route53 list-hosted-zones-by-name --dns-name "$DNS_ZONE" --max-items 1 \
            --query "HostedZones[?Name=='$DNS_ZONE.'].Id | [0]" --output text 2>/dev/null | sed 's|/hostedzone/||')
          if [ -z "$ZONE" ] || [ "$ZONE" = "None" ]; then
            echo "::warning::No Route53 zone for $DNS_ZONE. Create by hand: $DOMAIN A $HOST and auth.$DOMAIN A $HOST"
            exit 0
          fi
          cat > /tmp/records.json <<JSON
          {"Changes": [
            {"Action": "UPSERT", "ResourceRecordSet": {"Name": "$DOMAIN", "Type": "A", "TTL": 300, "ResourceRecords": [{"Value": "$HOST"}]}},
            {"Action": "UPSERT", "ResourceRecordSet": {"Name": "auth.$DOMAIN", "Type": "A", "TTL": 300, "ResourceRecords": [{"Value": "$HOST"}]}}
          ]}
          JSON
          aws route53 change-resource-record-sets --hosted-zone-id "$ZONE" --change-batch file:///tmp/records.json >/dev/null
          echo "$DOMAIN and auth.$DOMAIN -> $HOST"

      - name: Google OAuth client into Secrets Manager
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          if [ -z "$GOOGLE_CLIENT_ID" ] || [ -z "$GOOGLE_CLIENT_SECRET" ]; then
            echo "::warning::GOOGLE_CLIENT_ID/SECRET not set; leaving whatever the secret already holds"
            exit 0
          fi
          CURRENT=$(aws secretsmanager get-secret-value --secret-id "$SECRET_ID" --query SecretString --output text)
          UPDATED=$(jq --arg id "$GOOGLE_CLIENT_ID" --arg secret "$GOOGLE_CLIENT_SECRET" \
            '.GOOGLE_CLIENT_ID = $id | .GOOGLE_CLIENT_SECRET = $secret' <<<"$CURRENT")
          if [ "$UPDATED" != "$CURRENT" ]; then
            aws secretsmanager put-secret-value --secret-id "$SECRET_ID" --secret-string "$UPDATED" >/dev/null
            echo "updated"
          fi

      # --- Deploy --------------------------------------------------------------
      - name: Wait for the box
        run: |
          SSH="ssh -i ~/.ssh/id_porchlight -o StrictHostKeyChecking=accept-new -o ConnectTimeout=10 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 ec2-user@$HOST"
          echo "SSH=$SSH" >> "$GITHUB_ENV"
          for i in $(seq 1 40); do
            # A fresh box is still running user-data; wait for it to finish.
            if $SSH 'sudo cloud-init status --wait >/dev/null; test -x /usr/local/lib/docker/cli-plugins/docker-compose'; then
              exit 0
            fi
            echo "box not ready ($i/40)"
            sleep 15
          done
          exit 1

      - name: Copy files
        run: |
          RSYNC="rsync -az --delete -e 'ssh -i $HOME/.ssh/id_porchlight -o StrictHostKeyChecking=accept-new'"
          eval $RSYNC --exclude .env --exclude 'terraform/' infra/ "ec2-user@$HOST:/opt/porchlight/infra/"
          eval $RSYNC --exclude node_modules --exclude '.env*' --exclude test server/ "ec2-user@$HOST:/opt/porchlight/server/"
          # The game last and with delayed deletes, so a page mid-load still finds its old files.
          eval $RSYNC --delete-delay site/ "ec2-user@$HOST:/opt/porchlight/site/"

      - name: Run deploy.sh
        run: |
          $SSH "SECRET_ID='$SECRET_ID' AWS_REGION='$AWS_REGION' DOMAIN='$DOMAIN' /opt/porchlight/infra/docker/deploy.sh"

      - name: Smoke test
        continue-on-error: true
        run: |
          for url in "https://$DOMAIN/" "https://$DOMAIN/auth/health" "https://auth.$DOMAIN/realms/porchlight/.well-known/openid-configuration"; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 10 --retry-all-errors "$url" || true)
            echo "$code $url"
            [ "$code" = 200 ] || echo "::warning::$url answered $code (DNS or certificates may still be settling)"
          done
