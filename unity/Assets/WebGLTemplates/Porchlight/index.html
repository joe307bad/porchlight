<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #a3c9ed; font-family: system-ui, sans-serif; }
    #unity-canvas { width: 100%; height: 100%; display: block; outline: none; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px; color: #1f3347;
    }
    #bar { width: 240px; height: 8px; border-radius: 4px; background: rgba(255, 255, 255, 0.5); overflow: hidden; }
    #fill { width: 0; height: 100%; background: #1f3347; transition: width 0.2s; }
    #error { color: #8a1c1c; max-width: 480px; text-align: center; }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="loading">
    <strong>{{{ PRODUCT_NAME }}}</strong>
    <div id="bar"><div id="fill"></div></div>
    <div id="error"></div>
  </div>
  <script>
    const canvas = document.getElementById("unity-canvas");
    // Holding the right mouse button looks around, so don't let the browser menu pop up.
    canvas.addEventListener("contextmenu", (e) => e.preventDefault());

    const buildUrl = "Build";
    const config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
    };

    const script = document.createElement("script");
    script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
    script.onload = () => {
      createUnityInstance(canvas, config, (progress) => {
        document.getElementById("fill").style.width = Math.round(progress * 100) + "%";
      }).then(() => {
        document.getElementById("loading").remove();
        canvas.focus();
      }).catch((message) => {
        document.getElementById("error").textContent = message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
